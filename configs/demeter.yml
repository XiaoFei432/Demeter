allocation_grid:
  cpu_values: [1, 2, 4, 8]
  memory_values_mb: [128, 512, 1024, 2048, 4096, 8192, 10240]

model:
  embedding_dim: 64
  gnn_layers: 3
  temporal_window: 5
  transformer_layers: 3
  transformer_heads: 8
  score_hidden: [32, 16]
  lr: 0.0003
  gamma: 1.0
  clip_epsilon: 0.2
  penalty_beta: 0.3
  timeout_seconds: 120

runtime:
  interval_seconds: 5
  max_wave_size: 20
  memory_loss_factor: 0.8
  enable_pruning: true
  pruning_history_limit: 8
  pruning_input_bucket_ratio: 0.25
  pruning_overload_threshold: 0.8
  enable_dop_tuning: true
  min_parallelism: 1
  max_parallelism: 256
  enable_cluster_rpc: false
  policy_path: checkpoints/demeter.pt
